<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Arial,sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <rect width="860" height="440" fill="#fff"/>
  <text x="430" y="24" text-anchor="middle" font-size="18" font-weight="bold">Lab 4 - Component and Route Tree</text>

  <rect x="300" y="40" width="260" height="46" rx="8" fill="#e9d5ff" stroke="#7c3aed"/>
  <text x="430" y="68" text-anchor="middle" font-weight="bold">HashRouter + ShopProvider (Context)</text>

  <rect x="350" y="110" width="160" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="430" y="135" text-anchor="middle" font-weight="bold">App</text>

  <rect x="40" y="190" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="100" y="215" text-anchor="middle">Navbar</text>
  <rect x="190" y="190" width="120" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="250" y="210" text-anchor="middle">Home</text><text x="250" y="224" text-anchor="middle" font-size="11">/</text>
  <rect x="340" y="190" width="120" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="400" y="210" text-anchor="middle">Products</text><text x="400" y="224" text-anchor="middle" font-size="11">/products</text>
  <rect x="490" y="190" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="565" y="210" text-anchor="middle">ProductDetails</text><text x="565" y="224" text-anchor="middle" font-size="11">/products/:id</text>
  <rect x="670" y="190" width="70" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="705" y="210" text-anchor="middle">Cart</text><text x="705" y="224" text-anchor="middle" font-size="11">/cart</text>
  <rect x="760" y="190" width="80" height="40" rx="8" fill="#fecaca" stroke="#dc2626"/><text x="800" y="210" text-anchor="middle">NotFound</text><text x="800" y="224" text-anchor="middle" font-size="11">*</text>

  <rect x="340" y="300" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="400" y="325" text-anchor="middle">ProductCard xN</text>
  <rect x="190" y="300" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="250" y="325" text-anchor="middle">Loader</text>

  <line x1="430" y1="86" x2="430" y2="108" stroke="#333" marker-end="url(#a)"/>
  <line x1="400" y1="150" x2="110" y2="188" stroke="#333" marker-end="url(#a)"/>
  <line x1="410" y1="150" x2="260" y2="188" stroke="#333" marker-end="url(#a)"/>
  <line x1="425" y1="150" x2="400" y2="188" stroke="#333" marker-end="url(#a)"/>
  <line x1="440" y1="150" x2="560" y2="188" stroke="#333" marker-end="url(#a)"/>
  <line x1="455" y1="150" x2="700" y2="188" stroke="#333" marker-end="url(#a)"/>
  <line x1="465" y1="150" x2="795" y2="188" stroke="#333" marker-end="url(#a)"/>
  <line x1="400" y1="230" x2="400" y2="298" stroke="#333" marker-end="url(#a)"/>
  <line x1="360" y1="230" x2="270" y2="298" stroke="#333" stroke-dasharray="4"/>

  <text x="40" y="385" font-size="12">Context (useShop): cart, favorites, cartCount, dispatch -> used by Navbar, ProductCard, ProductDetails, Cart</text>
  <text x="40" y="405" font-size="12">Loader (loading state) is used by Products and ProductDetails | NotFound handles unknown URLs and unknown product ids</text>
</svg>
